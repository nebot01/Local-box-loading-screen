<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    
    <!-- Подключение шрифта IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- ГЛАВНОЕ ПРАВИЛО --- */
        * {
            font-family: 'IBM Plex Mono', monospace !important;
            box-sizing: border-box;
        }

        /* --- ФОН --- */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            background-color: #111;
        }

        .bg-slide.active {
            opacity: 1;
        }

        /* --- СЕТКА --- */
        #grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(167, 167, 167, 0.164) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167, 167, 167, 0.164) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* --- ОБЕРТКА --- */
        .wrapper {
            position: absolute;
            bottom: 5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            z-index: 10;
        }

        /* --- ЗАГОЛОВОК --- */
        .server-title {
            font-size: 72px;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin: 0 0 5px 0;
            font-weight: 700;
            line-height: 1;
            text-align: center;
        }

        .title-red {
            color: #ff0000;
            text-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
        }

        .title-white {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* --- ОКНА --- */
        .vgui-box {
            position: relative;
            background-color: rgba(0, 0, 0, 0.92);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
            padding: 20px 25px;
            overflow: hidden;
        }

        .vgui-box > * {
            position: relative;
            z-index: 2;
        }

        /* --- ВЕРХНЕЕ ОКНО --- */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .connecting-text {
            font-size: 28px;
            color: #ff4848;
            letter-spacing: 0px;
        }

        .gamemode-text {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            font-weight: 500;
        }

        .main-status-text {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
            min-height: 20px;
        }

        /* Полоса загрузки */
        .loading-track {
            position: relative;
            width: 100%;
            height: 6px;
            background-color: #1a0505;
            border: 1px solid #550000;
            overflow: hidden;
        }

        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 100%;
            background-color: #ff4e4e;
            box-shadow: 0 0 15px #ff9f9f;
            animation: scanner 1s infinite ease-in-out alternate;
        }

        @keyframes scanner {
            0% { left: -30%; width: 20%; }
            50% { width: 40%; }
            100% { left: 100%; width: 20%; }
        }

        /* --- НИЖНИЕ ОКНА --- */
        .files-box, .music-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80px;
        }

        .files-label {
            font-size: 12px;
            color: #ff0000;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid #330000;
            padding-bottom: 4px;
            display: inline-block;
            font-weight: 700;
        }

        .current-file {
            font-size: 15px;
            color: #eee;
            word-break: break-all;
            line-height: 1.4;
        }

        /* --- МУЗЫКА --- */
        .music-status {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .music-icon {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1s infinite;
        }
        
        .music-icon.paused {
            background-color: #550000;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- ТОЧКИ --- */
        .dots span {
            opacity: 0;
            animation: smoothDots 1.4s infinite ease-in-out;
            font-weight: inherit;
        }

        .dots span:nth-child(1) { animation-delay: 0.0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes smoothDots {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div id="grid-overlay"></div>

    <!-- Аудио элемент -->
    <audio id="loading-music">
        <!-- Ссылка на ПЕРВЫЙ трек -->
        <source src="https://zcity-help.ru/content/music/dubstep.mp3" type="audio/mpeg">
    </audio>

    <div class="wrapper">
        <h1 class="server-title">
            <span class="title-red">Local</span><span class="title-white">-Box</span>
        </h1>

        <!-- ОКНО 1 -->
        <div class="vgui-box main-box">
            <div class="status-header">
                <div class="connecting-text">
                    Connecting<span class="dots"><span>.</span><span>.</span><span>.</span></span>
                </div>
                <div class="gamemode-text" id="gamemode">Sandbox</div>
            </div>
            <div class="main-status-text" id="status-primary">Initializing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
            <div class="loading-track"><div class="loading-bar"></div></div>
        </div>

        <!-- ОКНО 2 -->
        <div class="vgui-box files-box">
            <div class="files-label">File Operations</div>
            <div class="current-file" id="file-status">
                Downloading assets<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
        </div>

        <!-- ОКНО 3: МУЗЫКА -->
        <div class="vgui-box music-box">
            <div class="files-label">Background Audio</div>
            <div class="music-status">
                <span id="music-indicator" class="music-icon paused"></span>
                <span id="music-text">Initializing Audio...</span>
            </div>
        </div>
    </div>

    <script>
        // --- ФОН ---
        const images = [
            "https://cdn.discordapp.com/attachments/1414137790668734557/1478590861557104772/image.png?ex=69a8f48c&is=69a7a30c&hm=088fb3ab907879878ee217215468483a1e9706c5d3656dccb45e485995cb009e&",
            "https://cdn.discordapp.com/attachments/1414137790668734557/1478586140494921859/gmod_32Wnp5kjAl.jpg?ex=69a8f026&is=69a79ea6&hm=29aedff40ded0e8abc4e3b69403f3c02a0690890d190453180fe77a43d0a3a2f&",
            "https://cdn.discordapp.com/attachments/1441046306155003904/1441752016581033996/tenor.gif?ex=69a8bff3&is=69a76e73&hm=09c3d5cd856b0aea34fdba489b14417672f83b629985fd1a5c2e035f54278338&",
            "https://cdn.discordapp.com/attachments/1453444107195387944/1460672510189109323/9533a28dd3d6f86f.gif?ex=69a85e48&is=69a70cc8&hm=36acb47e62402739a788879a1523f9a33b9ef33837984947bf5c16fe09589458&",
            "https://cdn.discordapp.com/attachments/1447787036172877905/1463409322796253265/image.png?ex=69a86fe3&is=69a71e63&hm=7d66c9afcff1fe7923e4b8dfcf87649c2a0f5abc50d6a0e807646daf1e372aaa&",
            "https://cdn.discordapp.com/attachments/1423143588820422751/1478593370946408479/image.png?ex=69a8f6e2&is=69a7a562&hm=41b38f7f7ec3b42d665454116213732c733b718e9a7fb048654fe6a2adfbffec&",
            "https://cdn.discordapp.com/attachments/1294987768468078644/1312143891016843358/malxik_drakon.gif?ex=69a88d3a&is=69a73bba&hm=d12cb7cb0a32df117f2400c5aba0fd85b37b651cb807bc632ea468c033989bbb&",
            "https://cdn.discordapp.com/attachments/1453984273865638067/1463586959233384602/Gifius.ru.gif?ex=69a86c93&is=69a71b13&hm=12e7cdc3952b020923e4ac2369ab596ecb24b16c3ccd40ab6aac7ff9801d8aa2&",
            "https://cdn.discordapp.com/attachments/1087026850418675793/1362330536420442123/IMG-20241005-WA0002.gif?ex=69a8896e&is=69a737ee&hm=3834648e0a12fe5687df19aca7ccb5174f435a7751f8fbf106a5ea947b21d2e2&",
            "https://cdn.discordapp.com/attachments/1283596864213745715/1334733463231664328/4d1deaa7-b539-4164-a219-fc838179aedd.gif?ex=69a855a7&is=69a70427&hm=4be8bcc8b4d04a25553517ef45837155829941ed6140152eebf1df6ae886d4c2&"
        ];
        const slideInterval = 5000;
        const bgContainer = document.getElementById('bg-container');
        let currentIndex = 0;

        function initBackgrounds() {
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.classList.add('bg-slide');
                div.style.backgroundImage = `url('${url}')`;
                if (index === 0) div.classList.add('active');
                bgContainer.appendChild(div);
            });
            if (images.length > 1) setInterval(nextSlide, slideInterval);
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.bg-slide');
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }
        initBackgrounds();

        // --- УПРАВЛЕНИЕ МУЗЫКОЙ ---
        const music = document.getElementById('loading-music');
        const musicText = document.getElementById('music-text');
        const musicIcon = document.getElementById('music-indicator');
        
        // Ссылка на второй трек (Tuca Donka)
        const secondTrackUrl = "https://fine.sunproxy.net/file/T1ZXdFhRdW5YOVR0bGE3TVFEbHlqUVBPeXlCaEtUd3JHUkhMWGF6WC9XRVhIbnMyY1lCeHlDYVdkL1VXSDdjSDJDdzZiVXhYREpJZTg1dE1Qb2hiUzNNNm1jbEM1dkFwTGRvVnFEUEFqbkE9/CURSEDEVIL_DJ_FKU_Skorde_-_TUCA_DONKA_Kashimo_(SkySound.cc).mp3";

        // ГРОМКОСТЬ: Вернул 10% (0.1), можно ставить 0.05 (5%)
        music.volume = 0.1; 

        // Функция обновления текста
        function updateMusicUI(trackName) {
            musicText.innerText = "PLAYING: " + trackName + " (10%)";
            musicIcon.classList.remove('paused');
        }

        // 1. Запуск первой песни
        setTimeout(() => {
            const playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    updateMusicUI("LOADING SCREEN MUSIC");
                    
                    // 2. Таймер на 30 секунд для смены трека
                    setTimeout(() => {
                        console.log("Switching to Track 2");
                        music.src = secondTrackUrl;
                        music.play();
                        updateMusicUI("TUCA DONKA");
                    }, 30000); // 30000 мс = 30 секунд

                }).catch(error => {
                    console.log("Auto-play prevented");
                    musicText.innerText = "CLICK ANYWHERE TO START MUSIC";
                    musicIcon.classList.add('paused');
                    
                    document.body.addEventListener('click', function() {
                        music.play();
                        updateMusicUI("LOADING SCREEN MUSIC");
                        
                        // Если запустили кликом, тоже ставим таймер на смену
                        setTimeout(() => {
                            music.src = secondTrackUrl;
                            music.play();
                            updateMusicUI("TUCA DONKA");
                        }, 30000);
                        
                    }, { once: true });
                });
            }
        }, 1000); // Задержка 1с перед стартом

        // --- GMOD ИНТЕГРАЦИЯ ---
        const dotsHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('gamemode').innerText = gamemode || "Garry's Mod";
        }
        function SetStatusChanged(status) {
            document.getElementById('status-primary').innerHTML = status + dotsHTML;
            if(status && status.indexOf("Downloading") === -1) {
                document.getElementById('file-status').innerHTML = "System Idle" + dotsHTML;
            }
        }
        function DownloadingFile(fileName) {
            document.getElementById('status-primary').innerText = "Downloading Assets...";
            document.getElementById('file-status').innerHTML = "Downloading: <span style='color:#ff4848'>" + fileName + "</span>";
        }
        function SetFilesTotal(total) {}
        function SetFilesNeeded(needed) {}
    </script>
</body>
</html>
