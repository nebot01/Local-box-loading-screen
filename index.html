<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <style>
        /* Импорт шрифтов */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            /* ФОН (Картинка) */
            background-image: url('https://cdn.discordapp.com/attachments/1466961682713542807/1467011005505601576/image.png?ex=697ed3f7&is=697d8277&hm=b6b802c4724260a49fff4574222bb24127fc31c74dab1d895f700d192bb3bdfe&');
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'VT323', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Сдвиг меню вниз */
            justify-content: flex-start; 
            padding-top: 42vh; 
            
            color: white;
            user-select: none;
            box-sizing: border-box;
        }

        /* --- СЕТКА И ЗАТЕМНЕНИЕ --- */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.404);
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.336) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.274) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
        }

        /* --- АВТОРЫ --- */
        .authors-container {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            z-index: 20;
            color: #888;
            text-transform: uppercase;
        }

        .rainbow-names {
            font-weight: bold;
            font-size: 18px;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000);
            background-size: 200% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow_move 3s linear infinite;
        }

        @keyframes rainbow_move { to { background-position: 200% center; } }

        /* --- ШАПКА САНТЫ --- */
<!--    .santa-hat { -->
<!--        position: absolute; -->
<!--        top: -7px; -->
<!--        right: -20px; -->
<!--        width: 60px; -->
<!--        height: auto; -->
<!--        transform: rotate(15deg); -->
<!--        z-index: 15; -->
<!--        filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); -->
<!--    } -->

        /* --- СНЕЖИНКИ --- */
        .snowflake {
            position: absolute;
            top: -50px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.9;
            color: #fff; 
            animation: fall linear forwards;
            line-height: 1;
            text-shadow: 0 0 5px white;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* --- ЗАГОЛОВОК --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .server-title {
            font-size: 80px;
            color: #dd2020;
            text-shadow: 0 0 15px #ff0000;
            margin: 0;
            letter-spacing: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .title-part-box {
            position: relative; 
            display: inline-block;
            color: #ffffff; 
            text-shadow: 0 0 15px #ffffff;
        }

        .subtitle {
            font-size: 28px;
            color: #ff0000;
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- ОКНО ЗАГРУЗКИ --- */
        .loading-box {
            position: relative;
            width: 800px;
            background-color: rgba(0, 0, 0, 0.603);
            border: 3px solid #ff0000;
            padding: 4px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.459);
        }

        .corner {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #e70000;
        }
        .corner-tl { top: -6px; left: -6px; }
        .corner-br { bottom: -6px; right: -6px; }

        /* --- СТАТУСЫ С НОВЫМ ШРИФТОМ И ТОЧКАМИ --- */
        
        .status-text {
            color: #ff0000;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace; 
        }

        .secondary-status {
            color: #ff000085;
            font-size: 15px;
            text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace;
        }

        /* АНИМАЦИЯ ТОЧЕК (Псевдо-элемент) */
        .status-text::after, 
        .secondary-status::after {
            content: '';
            display: inline-block;
            width: 0.8em; /* Фиксированная ширина, чтобы текст не прыгал */
            text-align: left;
            animation: blink-dots 1.5s infinite steps(4, end);
        }

        @keyframes blink-dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .file-status {
            color: #cccccc;
            font-size: 20px;
            margin-bottom: 25px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
            /* Файл оставляем стандартным шрифтом для читаемости путей */
            font-family: 'Share Tech Mono', monospace; 
        }

        /* --- ПОЛОСА ЗАГРУЗКИ --- */
        .progress-container {
            width: 80%;
            height: 4px; 
            background-color: #680000;
            margin: 0 auto 20px auto;
            border: 1px solid #ff0000;
            position: relative;
            overflow: hidden; 
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 36%;
            height: 100%;
            background-color: #ff3636;
            animation: pendulum_load 1.8s ease-in-out infinite alternate; 
        }

        @keyframes pendulum_load {
            0% { left: -36%; transform: scaleX(1); }
            50% { left: 100%; transform: scaleX(1); }
            100% { left: -36%; transform: scaleX(1); }
        }

    </style>
</head>
<body>

    <!-- АВТОРЫ -->
    <div class="authors-container">
        Authors: <span class="rainbow-names">Ne bot01, Wagan</span>
    </div>

    <div class="header">
        <h1 class="server-title">
            Local
            <!-- Блок с шапкой -->
            <span class="title-part-box">
                - Box
<!--                <img src="https://static.vecteezy.com/system/resources/previews/032/545/954/non_2x/christmas-santa-claus-red-and-white-hat-isolated-on-transparent-background-png.png" class="santa-hat" alt="Hat">-->
            </span>
        </h1>
        <div class="subtitle">Please wait while we prepare your session</div>
    </div>

    <div class="loading-box">
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <!-- Убрали точки из текста, они добавятся через CSS -->
        <div class="status-text" id="status-text">Connecting to server</div>
        <div class="file-status" id="file-display">Retrieving server info...</div>

        <div class="progress-container">
            <div class="progress-bar" id="load-bar"></div>
        </div>

        <!-- Убрали точки из текста -->
        <div class="secondary-status">Downloading assets</div>
    </div>

    <script>
        // --- ЛОГИКА СНЕЖИНОК ---
        function spawnSnowflake() {
            var snow = document.createElement('div');
            snow.innerHTML = "❄"; 
            snow.className = 'snowflake';
            snow.style.left = Math.random() * 100 + 'vw';
            var size = Math.random() * 20 + 15;
            snow.style.fontSize = size + 'px';
            var duration = Math.random() * 5 + 3;
            snow.style.animationDuration = duration + 's';
            document.body.appendChild(snow);
            setTimeout(function() { snow.remove(); }, duration * 1000);
        }
        setInterval(spawnSnowflake, 200);

        // --- ЛОГИКА GMOD ---

        function DownloadingFile(fileName) {
            document.getElementById('file-display').innerText = "Downloading " + fileName;
        }

        function SetStatusChanged(status) {
            // GMod часто присылает текст уже с точками (например, "Sending info...").
            // Мы удаляем их, чтобы использовать нашу CSS анимацию.
            var cleanStatus = status.replace(/\.+$/, "");
            document.getElementById('status-text').innerText = cleanStatus;
            
            if (status.includes("Sending client info")) {
                document.getElementById('file-display').innerText = "Finished downloading.";
            }
        }

        function SetFilesTotal(total) {}
        function SetFilesNeeded(needed) {}

        // --- РЕЖИМ ТЕСТИРОВАНИЯ В БРАУЗЕРЕ ---
        if (!navigator.userAgent.includes("Valve Source Client")) {
            let demoCounter = 0;
            document.getElementById('file-display').innerText = "DEMO MODE (Browser)";
            
            setInterval(() => {
                demoCounter++;
                if(demoCounter % 20 === 0) {
                     const fakeFiles = ["maps/ttt_67thway.bsp", "sound/weapons/ak47.wav", "Nab's Homicide Content", "Protogen Player Model"];
                     DownloadingFile(fakeFiles[Math.floor(Math.random()*fakeFiles.length)]);
                }
            }, 100);
        }
    </script>
</body>
</html>
