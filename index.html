<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'IBM Plex Mono', monospace !important; box-sizing: border-box; }
        
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .bg-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: 0; transition: opacity 1.5s ease-in-out; background-color: #111;
        }
        .bg-slide.active { opacity: 1; }

        #grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: linear-gradient(rgba(167, 167, 167, 0.164) 1px, transparent 1px), linear-gradient(90deg, rgba(167, 167, 167, 0.164) 1px, transparent 1px);
            background-size: 30px 30px; pointer-events: none;
        }

        .wrapper {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            width: 700px; display: flex; flex-direction: column; gap: 15px; z-index: 10;
        }

        /* --- СТИЛЬ ДЛЯ ВАШЕЙ КАРТИНКИ --- */
        .server-logo {
            display: block;
            margin: 0 auto -5px auto; 
            max-width: 400px; 
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.3)); /* Свечение под стиль интерфейса */
        }

        .server-title {
            font-size: 72px; text-transform: uppercase; letter-spacing: -3px;
            margin: 0 0 5px 0; font-weight: 700; line-height: 1; text-align: center;
        }
        .title-red { color: #ff0000; text-shadow: 0 0 25px rgba(255, 0, 0, 0.8); }
        .title-white { color: #ffffff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }

        .vgui-box {
            position: relative; background-color: rgba(0, 0, 0, 0.92);
            border: 2px solid #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
            padding: 20px 25px; overflow: hidden;
        }
        .vgui-box > * { position: relative; z-index: 2; }

        .status-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .connecting-text { font-size: 28px; color: #ff4848; letter-spacing: 0px; }
        .gamemode-text { font-size: 14px; color: #666; text-transform: uppercase; font-weight: 500; }
        .main-status-text { font-size: 16px; color: #ccc; margin-bottom: 15px; min-height: 20px; }

        .loading-track { position: relative; width: 100%; height: 6px; background-color: #1a0505; border: 1px solid #550000; overflow: hidden; }
        .loading-bar {
            position: absolute; top: 0; left: 0; width: 30%; height: 100%;
            background-color: #ff4e4e; box-shadow: 0 0 15px #ff9f9f;
            animation: scanner 1s infinite ease-in-out alternate;
        }
        @keyframes scanner { 0% { left: -30%; width: 20%; } 50% { width: 40%; } 100% { left: 100%; width: 20%; } }

        .music-box { display: flex; flex-direction: column; justify-content: center; min-height: 80px; }
        .files-label {
            font-size: 12px; color: #ff0000; text-transform: uppercase; margin-bottom: 8px;
            border-bottom: 1px solid #330000; padding-bottom: 4px; display: inline-block; font-weight: 700;
        }

        .music-status { font-size: 14px; color: #aaa; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .music-icon {
            display: inline-block; width: 10px; height: 10px; background-color: #ff0000;
            border-radius: 50%; box-shadow: 0 0 10px #ff0000; animation: pulse 1s infinite;
        }
        .music-icon.paused { background-color: #550000; box-shadow: none; animation: none; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        .dots span { opacity: 0; animation: smoothDots 1.4s infinite ease-in-out; font-weight: inherit; }
        .dots span:nth-child(1) { animation-delay: 0.0s; } .dots span:nth-child(2) { animation-delay: 0.2s; } .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes smoothDots { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div id="grid-overlay"></div>

    <audio id="loading-music"></audio>

    <div class="wrapper">
        <!-- ТА САМАЯ КАРТИНКА -->
        <img src="images/epsteinigrad.png" alt="Epsteinigrad Logo" class="server-logo">
        
        <h1 class="server-title">
            <span class="title-red"></span><span class="title-white">GomikGrad</span>
        </h1>

        <div class="vgui-box main-box">
            <div class="status-header">
                <div class="connecting-text">Connecting<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
                <div class="gamemode-text" id="gamemode">Sandbox</div>
            </div>
            <div class="main-status-text" id="status-primary">Initializing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
            <div class="loading-track"><div class="loading-bar"></div></div>
        </div>

        <div class="vgui-box music-box">
            <div class="files-label">Background Audio</div>
            <div class="music-status">
                <span id="music-indicator" class="music-icon paused"></span>
                <span id="music-text">Initializing Playlist...</span>
            </div>
        </div>
    </div>

    <script>
        const images = [
            "https://i.pinimg.com/736x/ff/ac/8f/ffac8f893d3acb8ca5f8c174f5721f0d.jpg",
            "https://i.pinimg.com/736x/5f/58/be/5f58be1f63f173dce4aa74be3b641352.jpg",
            "https://i.pinimg.com/736x/c8/c5/ac/c8c5ac59a40e460818670f7c3946e29f.jpg",
            "https://i.pinimg.com/736x/94/eb/d9/94ebd9e7f7680629afe660550dcb37b0.jpg",
            "https://i.pinimg.com/736x/2c/51/41/2c51412e6c6fbf2a6f597277b934eda9.jpg",
            "https://i.pinimg.com/736x/57/56/d4/5756d4bd7bcf094ecdd6a3823ffd6fe6.jpg",
            "https://i.pinimg.com/736x/b6/57/bb/b657bb7162177cf14055f52efdbf9954.jpg",
            "https://media1.tenor.com/m/ENuhpf36sZAAAAAd/kinji-hakari-jujutsu-kaisen.gif",
            "https://github.com/mard3nn/gcr-loadscreen/blob/main/imgs/8.gif?raw=true"
        ];
        const slideInterval = 5000;
        const bgContainer = document.getElementById('bg-container');
        let currentIndex = 0;

        function initBackgrounds() {
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.classList.add('bg-slide');
                div.style.backgroundImage = `url('${url}')`;
                bgContainer.appendChild(div);
            });

            currentIndex = Math.floor(Math.random() * images.length);
            const slides = document.querySelectorAll('.bg-slide');
            slides[currentIndex].classList.add('active');

            if (images.length > 1) setInterval(nextSlide, slideInterval);
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.bg-slide');
            slides[currentIndex].classList.remove('active');

            let nextIndex;
            if (slides.length > 1) {
                do {
                    nextIndex = Math.floor(Math.random() * slides.length);
                } while (nextIndex === currentIndex);
            } else {
                nextIndex = 0;
            }

            currentIndex = nextIndex;
            slides[currentIndex].classList.add('active');
        }
        initBackgrounds();

        const musicVolume = 0.1;
        const fadeTime = 2000; 
        
        const playlist = [
            { name: "DUBSTEP", url: "https://zcity-help.ru/content/music/dubstep.mp3", duration: 30000 },
            //{ name: "TUCA DONKA", url: "https://fine.sunproxy.net/file/T1ZXdFhRdW5YOVR0bGE3TVFEbHlqUVBPeXlCaEtUd3JHUkhMWGF6WC9XRVhIbnMyY1lCeHlDYVdkL1VXSDdjSDJDdzZiVXhYREpJZTg1dE1Qb2hiUzNNNm1jbEM1dkFwTGRvVnFEUEFqbkE9/CURSEDEVIL_DJ_FKU_Skorde_-_TUCA_DONKA_Kashimo_(SkySound.cc).mp3", duration: 30000 },
            //{ name: "WAS WOLEN WIR TRINKEN", url: "https://fine.sunproxy.net/file/T1ZXdFhRdW5YOVR0bGE3TVFEbHlqUVBPeXlCaEtUd3JHUkhMWGF6WC9XR3dSTmdRQW9YTEx4ME5qR1lHcWlCTmVyN2pLWFAzdzZvcEoyZWFmZDlHNW5IWnF1dHpTTEpqTW5BS0JmRGZPNW89/nemeckaya_-_Was_wollen_wir_trinken_(SkySound.cc).mp3", duration: 60000 },
            //{ name: "UNIVERSAL COLLAPSE", url: "https://fine.sunproxy.net/file/T1ZXdFhRdW5YOVR0bGE3TVFEbHlqUVBPeXlCaEtUd3JHUkhMWGF6WC9XR29oOXlnSWprRnpVRHF3VW1NS0Y5OHV2SVEzRThkczY4SEJ2UnFYZVlLYjJ5YjRqcHNBYkMvVXhDU21ONGkveXM9/Terraria_Calamity_Mod_-_UNIVERSAL_COLLAPSE_(SkySound.cc).mp3", duration: 60000 },
        ];

        const music = document.getElementById('loading-music');
        const musicText = document.getElementById('music-text');
        const musicIcon = document.getElementById('music-indicator');
        
        let trackIndex = -1;
        let isFirstTrack = true;
        let switchTimer = null;
        let fadeOutTimer = null;
        let fadeInterval = null;

        function updateMusicUI(trackName) {
            musicText.innerText = "PLAYING: " + trackName + " (" + (musicVolume*100) + "%)";
            musicIcon.classList.remove('paused');
        }

        function animateVolume(fromVol, toVol, duration) {
            if (fadeInterval) clearInterval(fadeInterval);
            const start = Date.now();
            const stepTime = 50;
            fadeInterval = setInterval(() => {
                let timePassed = Date.now() - start;
                let progress = timePassed / duration;
                if (progress > 1) progress = 1;
                
                let currentVol = fromVol + (toVol - fromVol) * progress;
                if (currentVol < 0) currentVol = 0;
                if (currentVol > 1) currentVol = 1;
                
                music.volume = currentVol;
                if (progress === 1) clearInterval(fadeInterval);
            }, stepTime);
        }

        function getRandomIndex(max) {
            return Math.floor(Math.random() * max);
        }

        function playRandomTrack() {
            let nextIndex;
            if (playlist.length > 1) {
                do { nextIndex = getRandomIndex(playlist.length); } while (nextIndex === trackIndex);
            } else { nextIndex = 0; }
            playTrack(nextIndex);
        }

        function playTrack(index) {
            trackIndex = index;
            const track = playlist[index];
            
            if (switchTimer) clearTimeout(switchTimer);
            if (fadeOutTimer) clearTimeout(fadeOutTimer);

            music.src = track.url;
            
            if (isFirstTrack) {
                music.volume = musicVolume; 
            } else {
                music.volume = 0;
            }
            
            const playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    updateMusicUI(track.name);
                    
                    if (isFirstTrack) {
                        isFirstTrack = false; 
                    } else {
                        animateVolume(0, musicVolume, fadeTime);
                    }
                    
                    fadeOutTimer = setTimeout(() => {
                        animateVolume(musicVolume, 0, fadeTime);
                    }, track.duration - fadeTime);

                    switchTimer = setTimeout(() => {
                        playRandomTrack();
                    }, track.duration);

                }).catch(error => {
                    musicText.innerText = "CLICK ANYWHERE TO START MUSIC";
                    musicIcon.classList.add('paused');
                    document.body.addEventListener('click', function() {
                        playTrack(trackIndex);
                    }, { once: true });
                });
            }
        }

        playRandomTrack();

        const dotsHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
        
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('gamemode').innerText = gamemode || "Garry's Mod";
        }

        function SetStatusChanged(status) {
            document.getElementById('status-primary').innerHTML = status + dotsHTML;
        }

        function DownloadingFile(fileName) {
            document.getElementById('status-primary').innerText = "Downloading Assets...";
        }

        function SetFilesTotal(total) {}
        function SetFilesNeeded(needed) {}
    </script>
</body>
</html>
